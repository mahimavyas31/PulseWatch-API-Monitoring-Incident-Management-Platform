<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#555"/></marker></defs><rect width="920" height="540" fill="#ffffff"/><text x="460" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">PulseWatch — System Architecture</text><rect x="30" y="60" width="170" height="56" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="1.5"/><text x="115.0" y="82" text-anchor="middle" font-weight="700" font-size="14" fill="#1a1a1a">User / Browser</text><text x="115.0" y="104" text-anchor="middle" font-size="12" fill="#333">dashboard</text><rect x="30" y="140" width="170" height="56" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="1.5"/><text x="115.0" y="162" text-anchor="middle" font-weight="700" font-size="14" fill="#1a1a1a">API client</text><text x="115.0" y="184" text-anchor="middle" font-size="12" fill="#333">REST + JWT</text><rect x="30" y="220" width="170" height="56" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="1.5"/><text x="115.0" y="242" text-anchor="middle" font-weight="700" font-size="14" fill="#1a1a1a">Public visitor</text><text x="115.0" y="264" text-anchor="middle" font-size="12" fill="#333">status page</text><rect x="290" y="70" width="300" height="170" rx="10" fill="#e7f1ff" stroke="#0d6efd" stroke-width="1.5"/><text x="440.0" y="92" text-anchor="middle" font-weight="700" font-size="14" fill="#1a1a1a">Web process (FastAPI)</text><text x="440.0" y="114" text-anchor="middle" font-size="12" fill="#333">REST API  ·  JWT auth</text><text x="440.0" y="132" text-anchor="middle" font-size="12" fill="#333">Dashboard (Jinja2 + Bootstrap)</text><text x="440.0" y="150" text-anchor="middle" font-size="12" fill="#333">Public status page</text><text x="440.0" y="168" text-anchor="middle" font-size="12" fill="#333">SSRF validator</text><text x="440.0" y="186" text-anchor="middle" font-size="12" fill="#333">scrypt password hashing</text><text x="440.0" y="204" text-anchor="middle" font-size="12" fill="#333">ownership checks on every query</text><rect x="690" y="90" width="200" height="110" rx="10" fill="#fff4e6" stroke="#f08c00" stroke-width="1.5"/><text x="790.0" y="112" text-anchor="middle" font-weight="700" font-size="14" fill="#1a1a1a">PostgreSQL</text><text x="790.0" y="134" text-anchor="middle" font-size="12" fill="#333">users · monitors</text><text x="790.0" y="152" text-anchor="middle" font-size="12" fill="#333">check_results · incidents</text><text x="790.0" y="170" text-anchor="middle" font-size="12" fill="#333">(Alembic migrations)</text><rect x="250" y="330" width="380" height="170" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.5"/><text x="440.0" y="352" text-anchor="middle" font-weight="700" font-size="14" fill="#1a1a1a">Scheduler process (APScheduler)</text><text x="440.0" y="374" text-anchor="middle" font-size="12" fill="#333">1. select due monitors (every 10 s)</text><text x="440.0" y="392" text-anchor="middle" font-size="12" fill="#333">2. health checker (HTTPX, no redirects)</text><text x="440.0" y="410" text-anchor="middle" font-size="12" fill="#333">3. status-code / body expectations</text><text x="440.0" y="428" text-anchor="middle" font-size="12" fill="#333">4. anomaly detector (rolling mean + std)</text><text x="440.0" y="446" text-anchor="middle" font-size="12" fill="#333">5. incident manager (open / resolve)</text><rect x="30" y="380" width="170" height="80" rx="10" fill="#fff0f6" stroke="#c2255c" stroke-width="1.5"/><text x="115.0" y="402" text-anchor="middle" font-weight="700" font-size="14" fill="#1a1a1a">Monitored APIs</text><text x="115.0" y="424" text-anchor="middle" font-size="12" fill="#333">public internet</text><rect x="710" y="330" width="180" height="110" rx="10" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.5"/><text x="800.0" y="352" text-anchor="middle" font-weight="700" font-size="14" fill="#1a1a1a">Alert channels</text><text x="800.0" y="374" text-anchor="middle" font-size="12" fill="#333">Email (SMTP)</text><text x="800.0" y="392" text-anchor="middle" font-size="12" fill="#333">Slack / webhook</text><line x1="200" y1="88" x2="290" y2="110" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><line x1="200" y1="168" x2="290" y2="150" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><line x1="200" y1="248" x2="290" y2="190" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><line x1="590" y1="150" x2="690" y2="150" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><text x="640" y="142" text-anchor="middle" font-size="11" fill="#555">SQL</text><line x1="690" y1="170" x2="590" y2="170" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><line x1="630" y1="380" x2="740" y2="200" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><text x="720" y="300" text-anchor="middle" font-size="11" fill="#555">read / write</text><line x1="250" y1="420" x2="200" y2="420" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><text x="225" y="412" text-anchor="middle" font-size="11" fill="#555">HTTP GET</text><line x1="630" y1="400" x2="710" y2="390" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><text x="670" y="382" text-anchor="middle" font-size="11" fill="#555">alerts</text><text x="460" y="525" text-anchor="middle" font-size="11" fill="#777">Web and scheduler are separate processes sharing one database; the scheduler never blocks API requests.</text></svg>