{% extends "base.html" %}
{% block title %}Log in · PulseWatch{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <h1 class="h3 mb-3">Log in</h1>
  <form method="post" action="/login" class="card card-body">
    <label class="form-label">Email</label>
    <input class="form-control mb-3" type="email" name="email" value="{{ email or '' }}" required>
    <label class="form-label">Password</label>
    <input class="form-control mb-3" type="password" name="password" required>
    <button class="btn btn-primary">Log in</button>
  </form>
  <p class="mt-3">No account? <a href="/register">Register</a></p>
</div></div>
{% endblock %}
