<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PulseWatch{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">&#9889; PulseWatch</a>
    {% if user %}
    <form method="post" action="/logout" class="d-flex align-items-center gap-3 m-0">
      <span class="text-light small">{{ user.email }}</span>
      <button class="btn btn-outline-light btn-sm">Log out</button>
    </form>
    {% endif %}
  </div>
</nav>
<main class="container pb-5">
  {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
