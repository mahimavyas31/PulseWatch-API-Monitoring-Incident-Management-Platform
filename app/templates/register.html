{% extends "base.html" %}
{% block title %}Register · PulseWatch{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <h1 class="h3 mb-3">Create account</h1>
  <form method="post" action="/register" class="card card-body">
    <label class="form-label">Email</label>
    <input class="form-control mb-3" type="email" name="email" value="{{ email or '' }}" required>
    <label class="form-label">Password (min 8 characters)</label>
    <input class="form-control mb-3" type="password" name="password" minlength="8" required>
    <button class="btn btn-primary">Register</button>
  </form>
  <p class="mt-3">Already registered? <a href="/login">Log in</a></p>
</div></div>
{% endblock %}
